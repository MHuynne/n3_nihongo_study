[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "n3-study-studio-api"
version = "1.0.0"
description = "FastAPI backend for N3 Study Studio"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncmy>=0.2.10,<1",
    "authlib>=1.4,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<6",
    "slowapi>=0.1.9,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
n3-study-studio = "app.cli:main"

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
